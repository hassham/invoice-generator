name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# IG-79: restore dependencies and produce both build artifacts for a clean pipeline run.
# IG-80 (docs/TASKS.md T008): test/lint run before build/publish in each job, so a failure stops
# the job before the artifact-producing steps run at all - this is what "prevents an invalid
# release artifact" means in practice, not just a check that fails after the fact.
jobs:
  backend:
    name: Backend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore InvoiceApp.sln

      - name: Build
        run: dotnet build InvoiceApp.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test InvoiceApp.sln --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Publish Api
        run: dotnet publish src/InvoiceApp.Api/InvoiceApp.Api.csproj --configuration Release --no-build --output ../publish/api

      - uses: actions/upload-artifact@v4
        with:
          name: backend-api
          path: publish/api

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: |
            frontend/generated
            !frontend/generated/cache
